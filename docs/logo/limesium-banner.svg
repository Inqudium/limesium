<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 168" role="img" aria-label="Limesium — one structured endpoint line per HTTP exchange">
  <style>
    :root { --ink:#26221c; --line:#b5372a; --muted:#8a6f3c; }
    @media (prefers-color-scheme: dark) { :root { --ink:#e6e1d6; --line:#c94b38; --muted:#b09763; } }
    .serif { font-family: Georgia, 'Iowan Old Style', 'Times New Roman', serif; fill: var(--ink); }
    .tagline { font-family: ui-monospace, 'Cascadia Code', 'JetBrains Mono', Menlo, Consolas, monospace; fill: var(--muted); }
  </style>

  <!-- the limes: full-bleed red line through the whole banner, crossing the tile boundary -->
  <rect x="0" y="128" width="720" height="5" fill="var(--line)"/>
  <!-- one recorded crossing, far right -->
  <circle cx="692" cy="130.5" r="6" fill="var(--line)"/>

  <!-- element tile (symbol only; the banner line is its line) -->
  <g transform="translate(20 35.5)">
    <rect x="10" y="10" width="108" height="108" rx="10" fill="none" stroke="var(--ink)" stroke-width="6"/>
    <text x="26" y="38" class="serif" font-size="16" font-weight="600">1</text>
    <text x="64" y="78" class="serif" font-size="48" font-weight="700" text-anchor="middle">Lm</text>
  </g>

  <!-- wordmark: Roman spaced capitals -->
  <text x="190" y="98" class="serif" font-size="58" font-weight="700" letter-spacing="7">LIMESIUM</text>

  <!-- tagline as a log line -->
  <text x="193" y="121" class="tagline" font-size="14.5">one structured endpoint_* line per HTTP exchange</text>
</svg>
