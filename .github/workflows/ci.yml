name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Weekly, so a newly published advisory surfaces even when nothing was
  # committed - a scan that only runs on changes cannot see the world
  # changing around unchanged code.
  schedule:
    - cron: "17 4 * * 1"

# Least privilege, stated explicitly rather than inherited from the
# repository default (which an admin setting could widen for a workflow
# that also runs on fork pull requests).
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # Actions are pinned to commit SHAs, not to mutable tags: a retagged
      # or compromised release would otherwise execute here with the
      # workflow token. Dependabot (github-actions ecosystem) proposes the
      # bumps and keeps the trailing version comment in sync.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up JDK 25
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          distribution: temurin
          java-version: 25
          cache: maven

      - name: Build and test
        run: mvn --batch-mode --no-transfer-progress verify

      # Repo-local script instead of a third-party reporting action (this
      # workflow pins actions to SHAs; a summary needs no new supply-chain
      # surface). Runs on failure too, so a red build still shows which
      # classes failed without digging through the log.
      - name: Publish test summary
        if: always()
        run: python3 .github/scripts/surefire-summary.py

  # The reactor's tests run BEFORE packaging, against the limesium-common
  # module; the jars a consumer receives - common classes inlined,
  # dependency-reduced POM - are never loaded by them. The standalone
  # consumers under consumer-smoke/ (one per twin: a host carries exactly one
  # limesium module) depend on the installed jars like an application does.
  # The removal of limesium-common from the local repository is the point: a
  # dependency-reduced POM that still named the unpublished module fails here,
  # not at the first consumer. See ADR-0003.
  consumer-smoke:
    name: Consumer smoke tests of the shaded jars
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up JDK 25
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          distribution: temurin
          java-version: 25
          cache: maven

      - name: Install the twins (tests already gated by the build job)
        run: mvn --batch-mode --no-transfer-progress -DskipTests -Djacoco.skip=true install

      - name: Remove the unpublished module from the local repository
        run: rm -rf ~/.m2/repository/eu/inqudium/limesium-common

      # The consumers' POM pins the twins' version by hand for a local run; here it is derived from
      # the reactor's root POM so the pin cannot drift from `revision` without anyone noticing.
      - name: Resolve the reactor's version
        id: reactor
        run: echo "version=$(mvn --batch-mode --no-transfer-progress -q org.apache.maven.plugins:maven-help-plugin:3.5.1:evaluate -Dexpression=project.version -DforceStdout)" >> "$GITHUB_OUTPUT"

      - name: Build and test the consumers against the installed jars
        run: mvn --batch-mode --no-transfer-progress -f consumer-smoke/pom.xml -Dlimesium.version="${{ steps.reactor.outputs.version }}" verify

      # From consumer-smoke/, not from the repository root: the script globs
      # `*/target/surefire-reports`, one module component before `target`, and
      # the two consumers sit one level below consumer-smoke/.
      - name: Publish test summary
        if: always()
        run: python3 ../.github/scripts/surefire-summary.py
        working-directory: consumer-smoke

  # The standalone JMH module is deliberately no reactor child, so `mvn verify`
  # never compiles it - a renamed or moved production type can silently break
  # the PERF_ANALYSIS verification trail (it did once: a stale BodyReadState
  # import). This smoke build pins the benchmarks to the current module APIs
  # without pulling JMH measurements into the product build.
  benchmarks-smoke:
    name: Benchmarks compile smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up JDK 25
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          distribution: temurin
          java-version: 25
          cache: maven

      - name: Install the modules under test
        run: mvn --batch-mode --no-transfer-progress -DskipTests install

      - name: Compile the standalone benchmarks against them
        run: mvn --batch-mode --no-transfer-progress -f benchmarks/pom.xml -DskipTests package

  dependency-scan:
    name: Dependency vulnerability scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up JDK 25
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          distribution: temurin
          java-version: 25
          cache: maven

      # An SBOM of the RESOLVED graph, not a scan of pom.xml: most versions
      # here are managed by the Spring Boot BOM and never appear in pom.xml,
      # so only the resolved graph states what actually ships. The aggregate
      # goal folds both modules into one root target/bom.json; test-scoped
      # dependencies are excluded (they reach no consumer).
      - name: Generate CycloneDX SBOM of the resolved dependencies
        run: mvn --batch-mode --no-transfer-progress -DskipTests cyclonedx:makeAggregateBom

      # Fails the job when a dependency is affected by a known advisory.
      # No API key needed (OSV.dev aggregates GHSA, CVE and friends). If an
      # advisory is ever unfixable and provably not exploitable here, record
      # it with a dated rationale in osv-scanner.toml rather than removing
      # this gate - see CONTRIBUTING.md.
      - name: Scan the SBOM against the OSV database
        uses: google/osv-scanner-action/osv-scanner-action@a345acffa64b0eaede81a3d9aae6141214d9c8fc # v2.6.0
        with:
          scan-args: |-
            --lockfile=./target/bom.json

      # Kept regardless of the scan result, so a red run leaves behind the
      # exact dependency set it judged.
      - name: Upload SBOM
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: sbom-cyclonedx
          path: target/bom.json
          if-no-files-found: error
