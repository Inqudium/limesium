name: Fuzz

# Daily time-boxed fuzzing of the @FuzzTest targets (Jazzer's JUnit
# integration, see CONTRIBUTING.md) on the project's own JDK - no OSS-Fuzz
# containers, no second build system. In every regular `mvn verify` the same
# tests run in cheap regression mode (checked-in inputs plus the empty
# input); here JAZZER_FUZZ=1 switches them to real exploration, each capped
# by its @FuzzTest maxDuration.

on:
  schedule:
    - cron: "47 2 * * *"
  # Manual runs for trying out new fuzz targets.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fuzz:
    runs-on: ubuntu-latest
    strategy:
      # In fuzzing mode Jazzer executes only ONE @FuzzTest per JVM (the
      # rest are skipped), so each target gets its own matrix job.
      fail-fast: false
      matrix:
        target:
          - BoundedBodyCaptureFuzzTest
          - HeaderMaskingFuzzTest
          - TraceparentFuzzTest
    steps:
      # Pinned to commit SHAs, not mutable tags - see ci.yml for the
      # rationale.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up JDK 25
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6
        with:
          distribution: temurin
          java-version: 25
          cache: maven

      # failIfNoSpecifiedTests=false lets the reactor modules that do not
      # contain this target pass with zero tests instead of failing.
      - name: Fuzz ${{ matrix.target }}
        env:
          JAZZER_FUZZ: "1"
        run: |
          mvn --batch-mode --no-transfer-progress -Djacoco.skip=true \
            -Dtest=${{ matrix.target }} -Dsurefire.failIfNoSpecifiedTests=false test

      # A finding is written into the seed-corpus directory next to the test
      # sources; committed, it becomes a permanent regression input.
      - name: Upload finding (reproducing input)
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: fuzz-finding-${{ matrix.target }}
          path: |
            **/src/test/resources/**/*Inputs/**
            **/target/surefire-reports/**
          if-no-files-found: warn

      # The corpus the run grew (jazzer-junit writes it to .cifuzz-corpus/ in
      # the module directory, git-ignored). Kept on success too, so an input
      # that reached a branch the seeds do not can be promoted into the seed
      # directory by hand - see CONTRIBUTING.md.
      - name: Upload grown corpus
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: fuzz-corpus-${{ matrix.target }}
          path: "**/.cifuzz-corpus/**"
          if-no-files-found: ignore
