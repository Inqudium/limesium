name: Bug report
description: Report a defect in one of the logging filters
labels: [bug]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: >
        What did you observe, and what did you expect instead?
        Include the emitted endpoint_* log line(s) if relevant -
        redact sensitive values before posting.
    validations:
      required: true
  - type: dropdown
    id: module
    attributes:
      label: Module
      options:
        - limesium-servlet-logging
        - limesium-reactive-logging
        - both
    validations:
      required: true
  - type: textarea
    id: config
    attributes:
      label: Configuration
      description: The relevant endpoint-logging.* properties from your application.yml/properties.
      render: yaml
    validations:
      required: false
  - type: input
    id: version
    attributes:
      label: Limesium version
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: "JDK, Spring Boot version, and stack: Tomcat / Netty, Reactor / coroutines."
    validations:
      required: false
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Minimal steps or a small sample project, if possible.
    validations:
      required: false
