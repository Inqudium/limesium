site_name: Limesium
site_description: One structured endpoint_* log line per HTTP exchange, at the service's own boundary
site_url: https://inqudium.github.io/limesium/
repo_url: https://github.com/Inqudium/limesium
repo_name: Inqudium/limesium
edit_uri: edit/main/docs/

theme:
  name: material
  logo: logo/limesium-icon.svg
  favicon: logo/limesium-icon.svg
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: red
      accent: amber
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: red
      accent: amber
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy
    - content.action.edit

nav:
  - Home: index.md
  # The long-form guides live next to their module sources (outside this
  # docs_dir), so the site links to them on GitHub instead of duplicating.
  - Servlet guide: https://github.com/Inqudium/limesium/blob/main/limesium-servlet-logging/docs/GUIDE.md
  - Reactive guide: https://github.com/Inqudium/limesium/blob/main/limesium-reactive-logging/docs/GUIDE.md
  - Elasticsearch mapping: elk/README.md
  - Configuration reference: https://github.com/Inqudium/limesium/blob/main/docs/endpoint-logging-reference.yml
  # Generated by .github/scripts/generate-test-catalog.py in the Docs
  # workflow (after `mvn verify`); not checked in - run the script before
  # building locally, or the --strict build fails (which is the guard
  # against a hand-maintained, drifting copy).
  - Test evidence: tests/test-evidence.md
  - Coverage report: https://inqudium.github.io/limesium/coverage/
  - API reference (servlet): https://inqudium.github.io/limesium/api/limesium-servlet-logging/
  - API reference (reactive): https://inqudium.github.io/limesium/api/limesium-reactive-logging/

markdown_extensions:
  - admonition
  - toc:
      permalink: true
  - pymdownx.highlight
  - pymdownx.superfences
  # Collapsible rationale blocks on the generated test-evidence page.
  - pymdownx.details
  - tables
